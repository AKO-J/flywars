# FlyWars CI — 代码质量 & 测试
#
# 运行策略：
#   - push / PR 到 main 分支触发完整 CI
#   - 其他分支仅运行 lint
#   - 测试使用 dummy video/audio driver（已配置在 tests/conftest.py）

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许手动触发
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Get changed Python files
        id: changed-python-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*.py

      - name: Run ruff check
        if: steps.changed-python-files.outputs.any_changed == 'true'
        run: |
          python - <<'PY'
          import json, subprocess
          files = json.loads(r'''${{ steps.changed-python-files.outputs.all_changed_and_modified_files_json }}''')
          if not files:
              raise SystemExit(0)
          subprocess.check_call(["ruff", "check", "--output-format=github", *files])
          PY

      - name: Run ruff format check
        if: steps.changed-python-files.outputs.any_changed == 'true'
        run: |
          python - <<'PY'
          import json, subprocess
          files = json.loads(r'''${{ steps.changed-python-files.outputs.all_changed_and_modified_files_json }}''')
          if not files:
              raise SystemExit(0)
          subprocess.check_call(["ruff", "format", "--check", *files])
          PY

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
      # 不因单版本失败而取消整个矩阵
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest --tb=short --color=yes

      - name: Verify game imports
        run: python -c "from core.game import Game; print('✓ Game class imports successfully')"
